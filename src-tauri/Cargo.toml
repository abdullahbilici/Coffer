[package]
name = "coffer"
version = "0.1.0"
description = "Local, Touch ID protected notes"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coffer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.11.1"
zeroize = { version = "1.9.1", features = ["serde"] }
security-framework = "3.7.0"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSDateFormatter", "NSDistributedNotificationCenter", "NSFormatter", "NSLocale", "NSNotification", "NSString"] }
objc2-local-authentication = "0.3.2"
thiserror = "2.0.21"
tauri-plugin-opener = "2.7.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
tauri-plugin-dialog = "2.8.3"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls", "json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Argon2id is unbearably slow unoptimized; dev builds would take seconds per backup unlock.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
